[pytest]
testpaths = tests
addopts = -ra
markers =
    unit: fast in-process unit tests (no HTTP server, no network)
    integration: cross-module behavior through real engines/services
    api: endpoint contract tests via the FastAPI TestClient
    security: Step-11 security controls (authn/z, headers, hardening)
    e2e: end-to-end workflow tests (upload → analyze → audit → verify)
    slow: long-running tests (noticeable pipeline/OCR time per test)
